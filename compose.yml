services:
  dns:
    image: ${IMAGE:-ghcr.io/charlestephen/technitium-dns-multi:latest}
    build:
      context: .
      dockerfile: Containerfile
    container_name: ${CONTAINER_NAME:-technitium-dns-multi}
    hostname: ${CONTAINER_HOSTNAME:-technitium-dns-multi}
    restart: unless-stopped
    # NET_ADMIN: keepalived adds the VIP. NET_RAW: VRRP raw sockets.
    cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE]
    env_file: .env
    networks:
      lan:
        ipv4_address: ${NODE_IP}
    volumes:
      - dns-config:/etc/dns
      - acme:/var/lib/acme.sh
      # - ./pgbouncer-userlist.txt:/etc/pgbouncer/userlist.txt:ro

networks:
  lan:
    driver: macvlan
    driver_opts:
      parent: ${LAN_PARENT_INTERFACE:-eth0}
    ipam:
      config:
        - subnet: ${LAN_SUBNET}
          gateway: ${LAN_GATEWAY}

volumes:
  dns-config:
  acme:
