name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
  schedule:
    - cron: '17 4 * * 1' # weekly rebuild to pick up distro security updates
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      GHCR_IMAGE: ghcr.io/charlestephen/technitium-dns-multi
      HUB_IMAGE: docker.io/charlestephen/technitium-dns-multi
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned upstream version
        id: up
        run: echo "technitium=$(sed -n 's/^ARG TECHNITIUM_VERSION=//p' Containerfile)" >> "$GITHUB_OUTPUT"

      # ponytail: QEMU arm64 emulation is slow; switch to native arm64 runners + manifest merge if build time hurts
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUSH == 'true'
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.HUB_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=technitium-${{ steps.up.outputs.technitium }},enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-
            type=ref,event=pr

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # Creates a GitHub release and a CHANGELOG.md entry whenever a bundled application's version changed.
  # The notes come from each application's own upstream release notes (scripts/release_notes.py).
  release:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/charlestephen/technitium-dns-multi
      HUB_IMAGE: docker.io/charlestephen/technitium-dns-multi
      DIGEST: ${{ needs.image.outputs.digest }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read package versions from the built image
        run: |
          docker run --rm --entrypoint dpkg-query "$GHCR_IMAGE@$DIGEST" \
            -W -f '${Package}=${Version}\n' keepalived pgbouncer kea-dhcp4-server libmsquic > packages.txt
          cat packages.txt

      - name: Look up the previous release
        run: |
          gh release view --json body --jq .body > previous.md 2>/dev/null || : > previous.md
          git ls-remote --tags --refs origin | sed 's#.*refs/tags/##' > tags.txt

      - name: Generate release notes
        id: notes
        run: |
          python3 -I scripts/release_notes.py \
            --packages packages.txt --previous-body previous.md --existing-tags tags.txt \
            --images "$GHCR_IMAGE" "$HUB_IMAGE" \
            --changelog CHANGELOG.md --out-release release.md

      - name: Tag the image with the release version
        if: steps.notes.outputs.changed == 'true'
        run: |
          docker buildx imagetools create \
            -t "$GHCR_IMAGE:${{ steps.notes.outputs.tag }}" -t "$HUB_IMAGE:${{ steps.notes.outputs.tag }}" \
            "$GHCR_IMAGE@$DIGEST"

      - name: Create the release
        if: steps.notes.outputs.changed == 'true'
        run: |
          gh release create "${{ steps.notes.outputs.tag }}" --target "$GITHUB_SHA" \
            --title "${{ steps.notes.outputs.tag }}" --notes-file release.md --latest

      # Committed through the contents API so GitHub signs the commit. The blob sha of the
      # checked-out file is sent, so the update is rejected if CHANGELOG.md changed meanwhile.
      - name: Update CHANGELOG.md
        if: steps.notes.outputs.changed == 'true'
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md" \
            -f message="Update changelog for ${{ steps.notes.outputs.tag }}" \
            -f branch="$BRANCH" \
            -f sha="$(git rev-parse HEAD:CHANGELOG.md)" \
            -f content="$(base64 < CHANGELOG.md | tr -d '\n')"
