[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:technitium]
command=/usr/local/bin/technitium-start.sh
autostart=%(ENV_ENABLE_TECHNITIUM)s
autorestart=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:dnsdist]
command=/usr/local/bin/dnsdist-start.sh
autostart=%(ENV_ENABLE_DNSDIST)s
autorestart=true
startretries=999
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:keepalived]
command=keepalived --dont-fork --log-console --log-detail -f /run/conf/keepalived.conf
autostart=%(ENV_ENABLE_KEEPALIVED)s
autorestart=true
startretries=999
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:pgbouncer]
command=pgbouncer /run/conf/pgbouncer.ini
user=postgres
autostart=%(ENV_ENABLE_PGBOUNCER)s
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:kea-dhcp4]
command=kea-dhcp4 -c /run/conf/kea-dhcp4.conf
autostart=%(ENV_ENABLE_KEA)s
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:kea-ctrl-agent]
command=kea-ctrl-agent -c /run/conf/kea-ctrl-agent.conf
autostart=%(ENV_ENABLE_KEA)s
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:acme]
command=/usr/local/bin/acme-run.sh
autostart=%(ENV_ENABLE_ACME)s
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
